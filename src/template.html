<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臺北酷課雲｜局處長官簡報</title>
<meta name="description" content="臺北酷課雲功能、服務與治理簡報">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E3A6E; --ink:#22314d; --blue:#3B82C4; --sky:#5AA9E6; --pale:#DCEEFB; --paper:#FBFDFF;
  --orange:#F0A23B; --soft:#F3F7FB; --line:#C9D9EA; --muted:#5d6b80;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9EFF6;color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#deck{width:1920px;height:1080px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--paper);display:none;overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px,#e3ecf6 1px,transparent 0);background-size:28px 28px}
.slide.on{display:block}
.slide::before{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(90deg,var(--sky),var(--pale) 60%,var(--orange))}
.inner{position:absolute;inset:70px 120px 70px 120px;display:flex;flex-direction:column;z-index:1}
.three .slide:not(.t-cover):not(.t-closing):not(.t-divider)::after{display:none}
@media (prefers-reduced-motion:no-preference){.slide.on .inner{animation:slidein .4s cubic-bezier(.2,.7,.2,1)}}
.slide .kicker{align-self:flex-start;width:fit-content;font-size:24px;color:#fff;background:#18409a;border-radius:999px;padding:5px 22px 6px;margin-bottom:12px;letter-spacing:.08em}
.slide .kicker::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#f2a516;margin-right:12px;vertical-align:2px}
.slide .kicker.big{font-size:32px;padding:8px 30px 9px;margin-bottom:22px}
@keyframes slidein{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.pno{position:absolute;right:40px;bottom:30px;font:700 26px "Noto Sans TC",sans-serif;color:var(--blue)}
.kicker{font:700 30px "Noto Sans TC",sans-serif;color:var(--blue);letter-spacing:.06em;margin-bottom:6px}
.kicker::before{content:"✎ ";color:var(--orange)}
.kicker.big{font-size:44px}
.title{margin:0 0 40px;font-weight:900;font-size:76px;color:var(--navy);line-height:1.15}
.title span{background:linear-gradient(transparent 62%,var(--pale) 62%);padding:0 10px;
  border-bottom:6px solid var(--orange);border-radius:0 0 40px 6px/0 0 10px 4px}
.foot{font-size:38px;font-weight:700;color:var(--navy);margin:28px 0 0;padding:14px 24px;background:#FFF6E6;border-left:10px solid var(--orange);border-radius:6px}
.src{position:absolute;left:0;bottom:-34px;margin:0;font-size:22px;color:var(--muted)}
.link{font-size:32px;color:var(--blue);margin-top:20px;font-weight:700}
mark{background:linear-gradient(transparent 55%,var(--pale) 55%);color:inherit}
/* 封面 */
.cover{position:absolute;inset:-70px -120px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 25%,rgba(255,255,255,.7),transparent 58%)}
.cover .ill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-text{position:relative;text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(245,250,255,.91));padding:44px 76px;border:2px solid rgba(255,255,255,.95);border-radius:36px;box-shadow:0 24px 80px rgba(30,58,110,.14),0 0 70px 30px rgba(251,253,255,.72)}
.cover-text::before{content:"";position:absolute;top:0;left:38%;right:38%;height:6px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,var(--blue),var(--orange))}
.cover .org{font:700 34px "Noto Sans TC",sans-serif;color:var(--blue)}
.cover h1{font-weight:900;font-size:112px;line-height:1.15;color:var(--navy);margin:18px 0}
.cover h1 mark{border-bottom:8px solid var(--orange)}
.cover .meta{font-size:40px;font-weight:700;color:var(--ink)}
.cover .who{margin-top:26px;display:flex;gap:40px;justify-content:center;font-size:36px}
.cover .who b{font:700 46px "Noto Sans TC",sans-serif;color:#B5462E}
.cover .hand{font:700 64px "Noto Sans TC",sans-serif;letter-spacing:.08em;color:var(--blue)}
/* 章節頁 */
.divider{display:flex;align-items:center;height:100%;gap:60px}
.dv-text{flex:1}
.dv-title{font-weight:900;font-size:130px;color:var(--navy);margin:10px 0;line-height:1.1}
.dv-sub{font:700 60px "Noto Sans TC",sans-serif;color:var(--ink);border-bottom:8px solid var(--orange);display:inline-block;padding-bottom:6px}
.dv-ill{width:760px;height:760px;flex:none;display:flex;align-items:center}
.dv-ill .ill{width:100%;height:100%;object-fit:contain;transform:rotate(2deg);filter:drop-shadow(0 24px 28px rgba(30,58,110,.16))}
/* 條列 */
.bul{margin:auto 0;padding-left:1.2em;font-size:50px;line-height:1.55}
.bul li{margin:8px 0}
.bul li::marker{color:var(--orange)}
.bul li.hl{font-weight:700;color:var(--navy)}
ol.bul li::marker{font-weight:900;color:var(--blue)}
.t-bullets .bul{font-size:56px;line-height:1.6}
/* 卡片：手繪框 */
.cards{display:grid;gap:34px;flex:1;min-height:0;grid-auto-rows:1fr;padding:12px 0}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}.c1{grid-template-columns:1fr}
.card{position:relative;display:flex;flex-direction:column;justify-content:center;background:#fff;border:3px solid var(--navy);padding:30px 34px;
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:8px 10px 0 var(--pale)}
.card h3{margin:0 0 14px;font-size:44px;font-weight:900;color:var(--navy)}
.card p{margin:0;font-size:36px;line-height:1.5}
.c3 .card h3{font-size:48px}.c3 .card p{font-size:40px}
.c4 .card h3{font-size:44px}.c4 .card p{font-size:36px}
.c5 .card{padding:26px 22px}.c5 .card h3{font-size:40px}.c5 .card p{font-size:32px}
.card .note{margin-top:18px;font:700 30px "Noto Sans TC",sans-serif;color:#B5462E}
.card .num{width:64px;height:64px;border-radius:50%;background:var(--orange);color:#fff;font:900 38px/64px "Noto Sans TC";text-align:center;margin-bottom:14px}
.arrows .card:not(:last-child)::after{content:"➜";position:absolute;right:-36px;top:46%;font-size:40px;color:var(--orange)}
.rd1{background:#F1F8FE}
.stat{border-radius:24px;padding:38px;background:linear-gradient(155deg,#fff,#f2f8fe);box-shadow:0 14px 32px rgba(30,58,110,.1);border:2px solid var(--line)}
.stat .big{font:900 92px "Noto Sans TC";color:var(--blue);line-height:1.1;margin-bottom:10px}
/* 步驟 */
.steps{list-style:none;margin:auto 0;padding:0;display:flex;flex-direction:column;gap:34px}
.steps li{display:flex;align-items:center;gap:30px;font-size:50px;font-weight:700;color:var(--navy);background:#fff;
  border:3px solid var(--navy);padding:22px 34px;border-radius:18px 255px 18px 225px/225px 18px 255px 18px;box-shadow:8px 10px 0 var(--pale)}
.steps .num{flex:none;width:80px;height:80px;border-radius:50%;background:var(--sky);color:#fff;font:900 46px/80px "Noto Sans TC";text-align:center}
.qs li{font-weight:500;font-size:44px;color:var(--ink)}
.qs .num:empty{display:none}
.situation{font-size:52px;font-weight:900;color:var(--navy);margin:16px 0 40px;line-height:1.4}
.situation .tag{display:inline-block;font-size:30px;background:var(--orange);color:#fff;border-radius:12px;padding:4px 18px;margin-right:18px;vertical-align:middle}
/* 表格 */
.tbl{margin:auto 0;border-collapse:separate;border-spacing:0;width:100%;font-size:40px;background:#fff;border:3px solid var(--navy);border-radius:20px;overflow:hidden}
.tbl th{background:var(--navy);color:#fff;padding:22px;font-size:42px}
.tbl td{padding:26px 22px;border-top:2px solid #e5eef7;text-align:center;height:110px}.tbl tbody tr:nth-child(even) td:not(:nth-child(3)){background:#f5f9fd}
.tbl.compact td{height:auto;padding:10px 22px;font-size:36px;line-height:1.35}.tbl.compact th{padding:14px;font-size:44px}
.tbl td:first-child{white-space:nowrap;font-weight:700;color:var(--navy)}
.tbl th:nth-child(3),.tbl td:nth-child(3){background:#FFF8EC}
.tbl th:nth-child(3){background:#B9741C}
/* 圖片 */
.shot{flex:1;display:flex;justify-content:center;align-items:center;min-height:0;gap:40px}
.shot img{height:100%;width:auto;max-width:100%;object-fit:contain;border:3px solid var(--navy);border-radius:14px;box-shadow:12px 14px 0 var(--pale);background:#fff}
.shot.two img{max-width:48%}
.vid{flex:1;display:flex;justify-content:center;align-items:center;min-height:0}.vid video{height:100%;max-width:100%;border:3px solid var(--navy);border-radius:14px;box-shadow:12px 14px 0 var(--pale);background:#000}
.shot.video iframe{height:100%;aspect-ratio:16/9;max-width:100%;border:3px solid var(--navy);border-radius:14px;box-shadow:12px 14px 0 var(--pale);background:#000}
.shot.three{gap:24px}.shot.three img{width:calc((100% - 48px)/3);height:auto;max-height:100%;max-width:none}
.prompt{position:relative;flex:1;min-height:0;margin:0}.prompt.code pre{margin:0;height:100%;max-height:none;overflow:auto;white-space:pre-wrap;background:#fff;border:3px solid var(--navy);border-radius:20px;padding:30px 40px;font:500 33px/1.55 'Noto Sans TC';color:var(--ink);box-shadow:12px 14px 0 var(--pale)}
.prompt.code.small pre{font-size:23px;line-height:1.42;padding:20px 36px}
.prompt.code.mid pre{font-size:27px;line-height:1.42;padding:22px 38px}
.prompt.code.big pre{font-size:44px;line-height:1.6;padding:40px 150px 40px 50px}
.steps.compact{gap:18px}.steps.compact li{font-size:38px;padding-top:14px;padding-bottom:14px}.steps.compact .num{width:64px;height:64px;font-size:36px;line-height:64px}
.prompt.code .copy{font-size:26px;padding:8px 22px;right:20px;top:20px;border-radius:20px}
.dls{display:flex;flex-wrap:wrap;gap:24px;margin-top:20px}
.st{display:flex;gap:42px;flex:1;min-height:0;align-items:center}
.st-img{flex:1.15;display:flex;justify-content:center;min-height:0;height:100%;align-items:center}
.st-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 2px #1E3A6E) drop-shadow(12px 14px 0 #DCEEFB)}
.st-text{flex:1}
.st-text p{font-size:42px;line-height:1.6;margin:0 0 28px}
.st-text p b{color:#B5462E}
.st.small .st-img{flex:.55}.st.small .st-text p{font-size:29px;line-height:1.22;margin:0 0 3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ill{mix-blend-mode:multiply}
.illus{flex:1;min-height:0;display:flex;justify-content:center}
.illus .ill{height:100%;max-width:100%;object-fit:contain;border-radius:24px}
.ill.missing{display:flex;align-items:center;justify-content:center;border:4px dashed var(--line);color:var(--muted);font-size:40px;width:70%;border-radius:30px}
.quote{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;margin:0;font:700 72px/1.55 "Noto Sans TC",sans-serif;color:var(--navy)}
.quote.q2{flex:none;font-size:64px;margin:20px 0 40px}
.rel{margin-top:26px;display:flex;align-items:center;gap:22px;font:900 44px 'Noto Sans TC';color:var(--navy)}.rel .tag{flex:none;font:700 28px 'Noto Sans TC';color:#fff;background:var(--sky);border-radius:30px;padding:8px 22px}
.aiday{display:flex;gap:60px;align-items:center;flex:1}
.aiday .bul{flex:1;font-size:44px}
.qr{width:420px;border:3px solid var(--navy);border-radius:14px;background:#fff;padding:10px}
.srcs{display:grid;grid-template-columns:1fr 1fr;gap:40px;font-size:31px;line-height:1.6}
.srcs ul{margin:0;padding-left:1em}
/* 新聞卡 */
.newsgrid{flex:1;display:grid;gap:32px;align-content:center;grid-auto-rows:1fr;min-height:0;padding:12px 0 20px}
.newsgrid.n2{grid-template-columns:1fr 1fr}.newsgrid.n1{grid-template-columns:1fr}.newsgrid.n3{grid-template-columns:repeat(3,1fr)}
.news{position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:linear-gradient(150deg,#fff,#f6faff);border:2px solid var(--line);border-top:7px solid var(--blue);border-radius:22px;box-shadow:0 16px 36px rgba(30,58,110,.1);overflow:hidden}
.news::before{content:"NEWS";position:absolute;right:-10px;top:-18px;font:900 120px "Noto Sans TC";color:#F1F6FC;z-index:0}
.news>*{position:relative}
.nw-text{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 40px 70px;min-width:0}
.nw-k{display:flex;gap:16px;align-items:center;font-size:28px;color:var(--muted)}
.nw-k b{background:var(--navy);color:#fff;border-radius:999px;padding:6px 18px;font-size:25px}.nw-k span{font-weight:700;letter-spacing:.03em}
.news h3{margin:28px 0 20px;font:900 50px/1.3 "Noto Sans TC";color:var(--navy)}
.news p{margin:0;font-size:34px;line-height:1.55;color:#4b5d77}
.nw-go{position:absolute;right:30px;bottom:20px;font:700 24px "Noto Sans TC";color:var(--blue)}
.ni{flex:1;display:flex;gap:70px;align-items:center;min-height:0}
.ni-img{height:100%;display:flex;align-items:center}
.ni-img img{height:100%;max-height:640px;border:3px solid var(--navy);border-radius:16px;box-shadow:12px 14px 0 var(--pale);background:#fff}
.ni-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:26px;flex:1}
.ni-steps li{display:flex;gap:26px;align-items:center;background:#fff;border:3px solid var(--navy);border-radius:18px;padding:18px 28px;font-size:40px}
.ni-steps b{flex:none;font:900 44px "Noto Sans TC";color:#fff;background:var(--orange);border-radius:12px;padding:4px 16px}
.nw-shot{display:block;width:100%;height:42%;min-height:0;object-fit:cover;object-position:top;border-bottom:3px solid var(--navy)}
.newsgrid.n1 .news.has-shot{flex-direction:row;align-items:stretch}
.newsgrid.n1 .nw-shot{width:48%;height:auto;align-self:stretch;object-fit:cover;border-bottom:0;border-right:3px solid var(--navy)}
.slide .inner .news img{cursor:pointer}
/* 臺北／酷AI 底部標籤 */
#tpbar{position:absolute;left:40px;bottom:22px;display:flex;align-items:center;gap:12px;font:700 22px "Noto Sans TC";color:var(--navy);pointer-events:none}
#tpbar i{font-style:normal;background:var(--orange);color:#fff;border-radius:999px;padding:2px 14px;font-size:20px}
@media print{#tpbar{display:none}}
/* 導覽頁 */
.navgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:44px;align-content:center}
.navcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:14px;background:#fff;border:3px solid var(--navy);border-radius:28px;padding:40px 40px 80px;box-shadow:12px 14px 0 var(--pale);cursor:pointer;font-family:"Noto Sans TC";color:var(--ink);transition:transform .15s,box-shadow .15s}
.navcard:hover{transform:translateY(-6px);box-shadow:12px 20px 0 #FFE2B8}
.navcard::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;background:var(--nav-color);border-radius:24px 0 0 24px}
.navcard::after{position:absolute;right:34px;top:18px;font:900 100px/1 "Noto Sans TC";color:var(--nav-color);opacity:.18}
.navcard:nth-child(1){--nav-color:#3B82C4}.navcard:nth-child(1)::after{content:"01"}
.navcard:nth-child(2){--nav-color:#E59A32}.navcard:nth-child(2)::after{content:"02"}
.navcard:nth-child(3){--nav-color:#328D83}.navcard:nth-child(3)::after{content:"03"}
.navcard .nv-k{background:var(--nav-color)}
.nv-k{font:900 30px "Noto Sans TC";color:#fff;background:var(--orange);border-radius:999px;padding:4px 22px}
.nv-t{font:900 64px/1.15 "Noto Sans TC";color:var(--navy)}
.nv-m{font:700 34px "Noto Sans TC";color:var(--blue)}
.nv-d{font-size:32px;line-height:1.5}
.nv-go{position:absolute;right:34px;bottom:26px;font:900 30px "Noto Sans TC";color:var(--orange)}
#secchip{position:fixed;left:14px;top:12px;z-index:11;display:flex;gap:6px;padding:5px;background:rgba(255,255,255,.92);border:2px solid var(--navy);border-radius:22px;box-shadow:0 4px 14px rgba(30,58,110,.2)}
#secchip button{font:700 15px "Noto Sans TC";border:none;background:#fff;color:var(--navy);border-radius:14px;padding:6px 12px;cursor:pointer}
#secchip button.act{background:var(--orange);color:#fff}
@media print{#secchip{display:none}}
/* 酷AI 元素（取自 ailms.tp.edu.tw 首頁）：logo 膠囊、吉祥物插圖 */
#tpbar{background:linear-gradient(90deg,#2BB5A8,#5CCFC2);border-radius:999px;padding:5px 16px 5px 12px;color:#fff}
#tpbar img{height:22px;display:block}
#tpbar i{background:#fff;color:#1E8F85}
.kscene{position:absolute;right:44px;top:22px;height:150px;pointer-events:none;z-index:1;filter:drop-shadow(0 6px 10px rgba(30,58,110,.12))}
.slide.t-cover .kscene,.slide.t-closing .kscene{top:auto;bottom:40px;right:60px;height:430px}
.slide.t-divider .kscene{top:auto;bottom:28px;right:auto;left:560px;height:190px}
.klogo{position:absolute;left:60px;top:48px;height:44px;padding:10px 18px;border-radius:14px;background:linear-gradient(90deg,#2BB5A8,#5CCFC2);z-index:2}
/* 工具列：貼齊最上緣、平常半透明，滑鼠移上去才清楚；滑鼠 2 秒不動就收起 */
#bar,#secchip{top:2px!important;opacity:.18;transition:opacity .25s,transform .25s;transform-origin:top center}
#bar{transform:translateX(-50%) scale(.82)}#secchip{transform:scale(.82);transform-origin:top left}
#bar:hover,#secchip:hover,body.uiwake #bar,body.uiwake #secchip{opacity:.95}
body.uiidle #bar,body.uiidle #secchip{opacity:0;pointer-events:none}
/* 六個段落共用深藍基底，以段落色區分 */
.slide[data-sec=s1]{--blue:#087e79;--sky:#28b4ab;--pale:#d9f3ef;--line:#b8dedb}
.slide[data-sec=s2]{--blue:#1768a2;--sky:#55b8db;--pale:#dceefa;--line:#bed8e9}
.slide[data-sec=s3]{--blue:#a85518;--sky:#db9655;--pale:#fae9d9;--line:#ead0b9}
.slide[data-sec=s4]{--blue:#7050a0;--sky:#a78bd0;--pale:#eee8f8;--line:#d8cbea}
.slide[data-sec=s5]{--blue:#4655a5;--sky:#8395dc;--pale:#e8ebfa;--line:#ccd2ed}
.slide[data-sec=s6]{--blue:#957019;--sky:#d0ad50;--pale:#f7f0d9;--line:#e5d9ae}
.slide.t-divider .dvno{position:absolute;left:0;bottom:0;font:900 280px/1 "Noto Sans TC";color:var(--blue);opacity:.09;pointer-events:none}
.slide.t-divider .divider{position:relative;z-index:1}
/* 右側配圖 */
.wa{display:flex;gap:44px;height:100%;min-height:0}
.wa-main{flex:1;min-width:0;display:flex;flex-direction:column}
.wa-art{flex:0 0 36%;margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
.wa-art img{max-width:100%;max-height:78%;object-fit:contain;border-radius:16px;border:3px solid var(--navy);box-shadow:10px 12px 0 var(--pale);background:#fff}
.wa-art img[src*="illus/"]{border:none;box-shadow:none;background:transparent;mix-blend-mode:multiply;max-height:88%}
.wa-art figcaption{margin-top:14px;font:500 22px "Noto Sans TC";color:var(--muted)}
.wa .cards.c4,.wa .cards.c5{grid-template-columns:repeat(2,1fr)}
/* ── 衝擊轉場：整頁從大到正位＋模糊淡入；元素依序彈出 */
@media (prefers-reduced-motion:no-preference){
.slide.on .inner{animation:hit .55s cubic-bezier(.16,1.2,.3,1) both}
@keyframes hit{0%{opacity:0;transform:scale(1.12) translateY(30px);filter:blur(10px)}60%{opacity:1;filter:blur(0)}100%{transform:none}}
.slide.on .title span{display:inline-block;animation:wipe .6s .12s cubic-bezier(.2,.9,.2,1) both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);transform:translateX(-30px)}to{clip-path:inset(0 0 0 0);transform:none}}
.slide.on .kicker{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}

<script>
const SIDE=/*SIDE*/[];
const slides=[...document.querySelectorAll('.slide')];
let cur=0, tab='sup';
const panel=document.getElementById('panel'), pbody=document.getElementById('pbody');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('deck').style.transform=`scale(${s})`;}
function show(i){cur=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,k)=>s.classList.toggle('on',k===cur));
  history.replaceState(null,'','#p'+slides[cur].dataset.label);document.getElementById('prog').style.width=((cur+1)/slides.length*100)+'%';renderPanel();}
function renderPanel(){const d=SIDE[cur];setTimeout(bindCopy,0);
  document.querySelectorAll('#panel header [data-tab]').forEach(b=>b.classList.toggle('act',b.dataset.tab===tab));
  if(tab==='sup') pbody.innerHTML=d.sup||'<p class="empty">這頁沒有補充資料。</p>';
  else if(d.notes){pbody.innerHTML='<div class="notes"></div>';pbody.firstChild.textContent=d.notes;}
  else pbody.innerHTML='<p class="empty">這頁沒有講稿。</p>';}
document.querySelectorAll('.slide .copy').forEach(b=>b.onclick=ev=>{ev.stopPropagation();navigator.clipboard.writeText(b.nextElementSibling.textContent);b.textContent='已複製';setTimeout(()=>b.textContent='複製',1500);});
function bindCopy(){pbody.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.nextElementSibling.textContent);b.textContent='已複製';setTimeout(()=>b.textContent='複製',1500);});}
function openPanel(t){if(panel.classList.contains('open')&&tab===t){panel.classList.remove('open');return;}tab=t;panel.classList.add('open');renderPanel();}
document.querySelectorAll('#panel header [data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderPanel();});
panel.querySelector('.x').onclick=()=>panel.classList.remove('open');
document.querySelectorAll('.supbtn').forEach(b=>b.onclick=()=>{tab='sup';panel.classList.add('open');renderPanel();});
const grid=document.getElementById('grid');
grid.innerHTML=slides.map((s,k)=>{const t=(s.querySelector('h1,h2,.situation')||s).textContent.trim().slice(0,40);
  return `<button data-k="${k}" class="${SIDE[k].sup?'has':''}"><b>${slides[k].dataset.label}</b>${t}</button>`}).join('');
grid.onclick=e=>{const b=e.target.closest('button');if(b){show(+b.dataset.k);grid.classList.remove('open');}};
function full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
bPrev.onclick=()=>show(cur-1);bNext.onclick=()=>show(cur+1);bGrid.onclick=()=>grid.classList.toggle('open');
bSup.onclick=()=>openPanel('sup');bNotes.onclick=()=>openPanel('notes');bFull.onclick=full;
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
  const k=e.key;if(['ArrowRight','PageDown',' ','Enter'].includes(k)){e.preventDefault();show(cur+1);}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();show(cur-1);}
  else if(k==='Home')show(0);else if(k==='End')show(slides.length-1);
  else if(k==='o'||k==='O')grid.classList.toggle('open');else if(k==='s'||k==='S')openPanel('sup');
  else if(k==='n'||k==='N')openPanel('notes');else if(k==='t'||k==='T')tp.classList.toggle('open');else if(k==='f'||k==='F')full();
  else if(k==='Escape'){grid.classList.remove('open');panel.classList.remove('open');tp.classList.remove('open');up.classList.remove('open');}});
let tx=null;addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(tx===null||panel.contains(e.target))return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));tx=null;});

// ===== 倒數計時（以結束時刻計算，換頁、切換分頁都不影響） =====
const tp=document.getElementById('timerPanel'), badge=document.getElementById('timerBadge'), tLeft=document.getElementById('tLeft'), tBar=document.getElementById('tBar'), glow=document.getElementById('edgeGlow'), up=document.getElementById('timesUp');
let tEnd=0, tTotal=0, tRemainPaused=null, tTimer=null, lastSec=-1, actx=null;
function ac(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
function beep(f,dur,vol,type='sine',when=0){const c=ac(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,c.currentTime+when);g.gain.exponentialRampToValueAtTime(vol,c.currentTime+when+0.01);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+when+dur);o.connect(g).connect(c.destination);o.start(c.currentTime+when);o.stop(c.currentTime+when+dur+0.05);}
function tick(sec){if(!tTick.checked)return; if(sec<=10&&tWarnSnd.checked){beep(sec%2?880:1175,0.12,0.25,'triangle');}else{beep(sec%2?1000:800,0.04,0.08,'square');}}
function warnMelody(){if(!tWarnSnd.checked)return;[659,784,880].forEach((f,i)=>beep(f,0.18,0.22,'triangle',i*0.16));}
function finale(){[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,0.28,0.3,'triangle',i*0.22));}
const fmt=s=>{s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),x=s%60;return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');};
function remain(){return tRemainPaused!==null?tRemainPaused:(tEnd-Date.now())/1000;}
function paint(){const r=remain(),sec=Math.ceil(r);tLeft.textContent=fmt(r);tBar.style.width=(tTotal?Math.max(0,r/tTotal*100):0)+'%';
  badge.classList.toggle('warn',sec<=60&&sec>10);badge.classList.toggle('danger',sec<=10&&sec>0);glow.classList.toggle('on',sec<=10&&sec>0&&tRemainPaused===null);
  badge.classList.toggle('paused',tRemainPaused!==null);
  if(tRemainPaused===null&&sec!==lastSec){if(lastSec>0){ if(sec===10)warnMelody(); if(sec>0)tick(sec);} lastSec=sec;}
  if(tRemainPaused===null&&r<=0){stopTimer(false);up.classList.add('open');finale();}}
function startTimer(total){ac();tTotal=total;tEnd=Date.now()+total*1000;tRemainPaused=null;lastSec=Math.ceil(total);badge.classList.add('show');clearInterval(tTimer);tTimer=setInterval(paint,100);paint();tp.classList.remove('open');}
function stopTimer(hide=true){clearInterval(tTimer);tTimer=null;glow.classList.remove('on');badge.classList.remove('warn','danger');if(hide){badge.classList.remove('show');tRemainPaused=null;}else{tLeft.textContent='00:00';tBar.style.width='0%';}}
tStart.onclick=()=>{const t=(+tMin.value||0)*60+(+tSec.value||0);if(t>0)startTimer(t);};
tp.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const t=+b.dataset.p;tMin.value=Math.floor(t/60);tSec.value=t%60;startTimer(t);});
tPause.onclick=()=>{if(!tTimer&&tRemainPaused===null)return;if(tRemainPaused===null){tRemainPaused=remain();}else{tEnd=Date.now()+tRemainPaused*1000;tRemainPaused=null;lastSec=Math.ceil(remain());}paint();};
tAdd.onclick=()=>{if(tRemainPaused!==null){tRemainPaused+=60;}else if(tTimer){tEnd+=60000;}else return;tTotal+=60;lastSec=Math.ceil(remain());paint();};
tReset.onclick=()=>{stopTimer(true);tp.classList.remove('open');};
badge.onclick=()=>tp.classList.toggle('open');
up.onclick=()=>{up.classList.remove('open');badge.classList.remove('show');};
bTimer.onclick=()=>tp.classList.toggle('open');
tp.addEventListener('keydown',e=>e.stopPropagation());

// 導覽：卡片與左上角按鈕跳到各模組第一頁；H 導覽頁、1/2/3 模組
function goSec(g){const k=g==='nav'?slides.findIndex(s=>s.classList.contains('t-nav')):slides.findIndex(s=>s.dataset.sec===g);if(k>=0)show(k);else location.href='index.html?go='+g;}
document.addEventListener('click',e=>{const h=e.target.closest('[data-href]');if(h){e.stopPropagation();location.href=h.dataset.href;}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){e.stopPropagation();goSec(b.dataset.go);}});
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;const k=e.key;
  if(k==='h'||k==='H')goSec('nav');else if(/^[1-6]$/.test(k))goSec('s'+k);});
const _show=show;show=function(i){const d=document.getElementById('deck');d.classList.remove('flash');void d.offsetWidth;d.classList.add('flash');_show(i);const s=slides[cur].dataset.sec;document.querySelectorAll('#secchip button').forEach(b=>b.classList.toggle('act',b.dataset.go===s));document.dispatchEvent(new Event('slidechange'));};
// 工具列：滑鼠移動時短暫顯示，2 秒不動就隱藏
(function(){let tm;const b=document.body;function wake(){b.classList.add('uiwake');b.classList.remove('uiidle');clearTimeout(tm);tm=setTimeout(()=>{b.classList.remove('uiwake');b.classList.add('uiidle');},2000);}
addEventListener('mousemove',wake,{passive:true});addEventListener('touchstart',wake,{passive:true});})();
document.querySelectorAll('.slide.t-divider').forEach(sl=>{const n=sl.dataset.sec.slice(1);if(/^[1-6]$/.test(n)){const d=document.createElement('div');d.className='dvno';d.textContent='0'+n;sl.querySelector('.inner').prepend(d);}});
addEventListener('resize',fit);fit();
{const g=new URLSearchParams(location.search).get('go');if(g)setTimeout(()=>goSec(g),0);}
const m=decodeURIComponent(location.hash).match(/^#p(.+)$/);const k0=m?slides.findIndex(s=>s.dataset.label===m[1]):0;show(k0<0?0:k0);
</script>

<script>
(function(){const reduced=matchMedia('(prefers-reduced-motion: reduce)');let animation=0;
function count(){cancelAnimationFrame(animation);document.querySelectorAll('.stat .big').forEach(el=>{if(el.dataset.value)el.textContent=el.dataset.value;else el.dataset.value=el.textContent;});
const items=[...document.querySelectorAll('.slide.on .stat .big')].map(el=>{const text=el.dataset.value,m=text.match(/^(?!.*[pP＝=])([^0-9]*)([0-9][0-9,]*(?:\.[0-9]+)?)(.*)$/);if(!m)return null;return {el,text,prefix:m[1],suffix:m[3],target:Number(m[2].replace(/,/g,'')),decimals:(m[2].split('.')[1]||'').length,group:m[2].includes(',')};}).filter(Boolean);
if(reduced.matches||!items.length)return;let start;function tick(t){if(start===undefined)start=t;const p=Math.min(1,(t-start)/1100),v=1-Math.pow(1-p,3);items.forEach(x=>{if(p===1){x.el.textContent=x.text;return;}let n=(x.target*v).toFixed(x.decimals);if(x.group){const parts=n.split('.');parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');n=parts.join('.');}x.el.textContent=x.prefix+n+x.suffix;});if(p<1)animation=requestAnimationFrame(tick);}animation=requestAnimationFrame(tick);}
document.addEventListener('slidechange',count);count();})();
</script>

<script>

// 臺北 101 低多邊形模型（取自 ai-b3-1121）：pal={glass,glass2,podium,cap,edge,band,tip,edgeO,bandO}
function make101(THREE,s,pal){
  const M=c=>new THREE.MeshLambertMaterial({color:c,transparent:true,opacity:pal.faceO||1});
  const glass=M(pal.glass),glass2=M(pal.glass2),podium=M(pal.podium),cap=M(pal.cap);
  const edge=new THREE.LineBasicMaterial({color:pal.edge,transparent:true,opacity:pal.edgeO||.55}),band=new THREE.LineBasicMaterial({color:pal.band,transparent:true,opacity:pal.bandO||.7});
  const tw=new THREE.Group();let y=0;
  const put=(rt,rb,h,m,bands)=>{const geo=new THREE.CylinderGeometry(rt*s,rb*s,h*s,4,1);const me=new THREE.Mesh(geo,m);me.position.y=y+h*s/2;me.rotation.y=Math.PI/4;tw.add(me);
    const l=new THREE.LineSegments(new THREE.EdgesGeometry(geo),edge);l.position.copy(me.position);l.rotation.copy(me.rotation);tw.add(l);
    for(let k=1;k<=(bands||0);k++){const f=k/(bands+1),r=(rb+(rt-rb)*f)*s+.3,yy=y+h*s*f,P=[];
      for(let q=0;q<4;q++){const a=q*Math.PI/2,b=a+Math.PI/2;P.push(new THREE.Vector3(Math.cos(a)*r,yy,Math.sin(a)*r),new THREE.Vector3(Math.cos(b)*r,yy,Math.sin(b)*r));}
      tw.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(P),band));}
    y+=h*s;};
  put(58,62,26,podium,1);put(27,37,118,glass2,5);put(31,31,4,cap);
  for(let i=0;i<8;i++){put(31,24,44,i%2?glass:glass2,3);put(32,32,3,cap);}   // 八節「花開富貴」
  put(17,23,22,cap,1);put(9,12,22,glass,1);put(.6,2.6,96,cap);
  const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,30);g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);
  const tip=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),color:pal.tip,transparent:true,depthWrite:false}));tip.scale.set(40*s,40*s,1);tip.position.y=y;tw.add(tip);
  tw.top=y;tw.tip=tip;return tw;}
// 共用一個 renderer；只有封面、章節、結尾與功能版圖頁需要繪製。
(function(){
  if(!window.THREE)return;
  const motion=matchMedia('(prefers-reduced-motion: reduce)');
  let renderer;
  try{renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});}catch(e){return;}
  const canvas=renderer.domElement;canvas.className='galaxy-canvas';canvas.setAttribute('aria-hidden','true');
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(40,1,1,2000);camera.position.z=850;
  const group=new THREE.Group();scene.add(group);
  const colors=[0x3dd8ca,0x60bfff,0xffb66d,0xc49aff,0x879cff,0xf2d379];
  const core=new THREE.Group();group.add(core);
  const material=(color,opacity)=>new THREE.MeshBasicMaterial({color,transparent:true,opacity,depthWrite:false});
  [[0,0,0,55],[-48,-3,0,34],[43,-2,0,37],[-22,29,0,35],[20,32,0,42]].forEach(([x,y,z,r])=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),material(0x78e4fa,.32));m.position.set(x,y,z);core.add(m);});
  const halo=new THREE.Mesh(new THREE.SphereGeometry(93,24,16),material(0x36b9ed,.08));core.add(halo);
  const nodes=colors.map(c=>{const g=new THREE.Group();const ball=new THREE.Mesh(new THREE.IcosahedronGeometry(20,2),material(c,.95));g.add(ball);const glow=new THREE.Mesh(new THREE.SphereGeometry(32,16,12),material(c,.14));g.add(glow);group.add(g);return g;});
  const ringPoints=[];for(let i=0;i<=128;i++){const a=i*Math.PI*2/128;ringPoints.push(new THREE.Vector3(Math.cos(a)*260,Math.sin(a)*180,0));}
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ringPoints),new THREE.LineBasicMaterial({color:0x50a8dc,transparent:true,opacity:.32})));
  const lineGeo=new THREE.BufferGeometry();const lineArray=new Float32Array(6*4*3);lineGeo.setAttribute('position',new THREE.BufferAttribute(lineArray,3));
  group.add(new THREE.LineSegments(lineGeo,new THREE.LineBasicMaterial({color:0x70d6f5,transparent:true,opacity:.48})));
  const particles=Array.from({length:18},(_,i)=>{const p=new THREE.Mesh(new THREE.SphereGeometry(i%3===0?4:2.5,8,6),material(colors[i%6],.95));group.add(p);return p;});
  const starPositions=[];let seed=17;const rand=()=>((seed=seed*16807%2147483647)/2147483647);
  for(let i=0;i<350;i++)starPositions.push((rand()-.5)*2100,(rand()-.5)*1200,(rand()-.5)*700-180);
  const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));
  const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0x9acbff,size:2.5,transparent:true,opacity:.65}));scene.add(stars);
  // ── 臺北天際線＋101（封面／章節／結尾）
  scene.add(new THREE.AmbientLight(0xffffff,.7));const sun=new THREE.DirectionalLight(0xbfe8ff,.9);sun.position.set(-400,600,500);scene.add(sun);
  const city=new THREE.Group();city.position.set(0,-312,0);scene.add(city);
  const T101=make101(THREE,.62,{glass:0x2f8fa8,glass2:0x1f6f8c,podium:0x24506e,cap:0x5fb8c8,edge:0x9fe8ff,band:0xd8fbff,tip:0xffb66d,edgeO:.75,bandO:.55,faceO:.92});
  T101.position.set(470,0,60);T101.rotation.y=.42;city.add(T101);
  const bFace=new THREE.MeshBasicMaterial({color:0x0b2a44,transparent:true,opacity:.85}),bEdge=new THREE.LineBasicMaterial({color:0x4fb7e0,transparent:true,opacity:.55}),
        fFace=new THREE.MeshBasicMaterial({color:0x0a2038,transparent:true,opacity:.6}),fEdge=new THREE.LineBasicMaterial({color:0x2f7fb0,transparent:true,opacity:.35});
  const roofs=[];for(let i=0;i<40;i++){const w=22+rand()*44,h=26+rand()*120,d=22+rand()*36,x=-620+i*32+rand()*14;if(Math.abs(x-470)<55)continue;
    const far=i%2===0,geo=new THREE.BoxGeometry(w,h*(far?1.25:1),d),m=new THREE.Mesh(geo,far?fFace:bFace);m.position.set(x,h*(far?1.25:1)/2,far?-260:-80);city.add(m);
    const l=new THREE.LineSegments(new THREE.EdgesGeometry(geo),far?fEdge:bEdge);l.position.copy(m.position);city.add(l);if(!far)roofs.push(m.position.clone().add(new THREE.Vector3(0,h/2,0)));}
  const tipV=new THREE.Vector3(470,T101.top,60),sky=roofs.filter((_,i)=>i%2===0).map(r=>[tipV,r]);
  city.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(sky.flat()),new THREE.LineBasicMaterial({color:0xffc98a,transparent:true,opacity:.22})));
  const skyDots=sky.map((e,i)=>{const p=new THREE.Mesh(new THREE.SphereGeometry(3,8,6),material(0xffb66d,.95));p.u={e,t:i/sky.length,v:.18+rand()*.25};city.add(p);return p;});
  let host=null, stage=null, labels=[], raf=0, start=0, lastTime=0;
  function frame(t){raf=0;if(!host||document.hidden)return;const elapsed=motion.matches?3:(t-start)/1000;lastTime=t;
    const map=!!stage, divider=host.classList.contains('t-divider');
    nodes.forEach((n,i)=>{const angle=i*Math.PI/3-Math.PI/2+(motion.matches?0:elapsed*.10);const entry=motion.matches?1:Math.min(1,Math.max(0,(elapsed-i*.12)/.7));const ease=1-Math.pow(1-entry,3);n.position.set(Math.cos(angle)*260*ease,Math.sin(angle)*180*ease,Math.sin(angle)*35);n.scale.setScalar(divider&&i===+host.dataset.sec.slice(1)-1?1.65:1);if(labels[i]){labels[i].style.left=(50+n.position.x/10)+'%';labels[i].style.top=(50-n.position.y/7.36)+'%';labels[i].style.opacity=String(ease);}});
    for(let i=0;i<6;i++){const a=nodes[i].position,b=nodes[(i+1)%6].position;lineArray.set([0,0,0,a.x,a.y,a.z,a.x,a.y,a.z,b.x,b.y,b.z],i*12);}lineGeo.attributes.position.needsUpdate=true;
    particles.forEach((p,i)=>{const a=nodes[i%6].position,b=i%2?nodes[(i+1)%6].position:core.position;const f=motion.matches?.5:(elapsed*.23+i/18)%1;p.position.lerpVectors(a,b,f);});
    city.visible=!map&&!divider;if(!map){T101.rotation.y=.42+(motion.matches?0:Math.sin(elapsed*.25)*.12);T101.tip.material.opacity=.6+.4*Math.abs(Math.sin(elapsed*2));
      skyDots.forEach(p=>{const f=motion.matches?p.u.t:(p.u.t+elapsed*p.u.v)%1;p.position.lerpVectors(p.u.e[0],p.u.e[1],f);});}
    core.scale.setScalar(1+(motion.matches?0:.04*Math.sin(elapsed*1.4)));renderer.render(scene,camera);
    if(!motion.matches)raf=requestAnimationFrame(frame);
  }
  function activate(){if(raf)cancelAnimationFrame(raf);raf=0;host=document.querySelector('.slide.on');stage=host&&host.querySelector('.gx-stage');labels=[];
    if(!host||(!stage&&!/t-(cover|divider|closing)/.test(host.className))){canvas.remove();return;}
    try{
      if(stage){const data=JSON.parse(stage.dataset.galaxy);if(!stage.querySelector('.gx-labels')){const wrap=document.createElement('div');wrap.className='gx-labels';const c=document.createElement('span');c.className='gx-center-label';c.textContent=data.core;wrap.appendChild(c);data.nodes.forEach(text=>{const el=document.createElement('span');el.className='gx-label';el.textContent=text;wrap.appendChild(el);});stage.appendChild(wrap);}labels=[...stage.querySelectorAll('.gx-label')];stage.prepend(canvas);renderer.setSize(720,530,false);camera.aspect=720/530;camera.position.set(0,0,850);group.position.set(0,0,0);group.scale.setScalar(.84);stars.visible=false;}
      else{host.prepend(canvas);renderer.setSize(1920,1080,false);camera.aspect=1920/1080;camera.position.set(0,0,850);group.position.set(host.classList.contains('t-divider')?120:215,40,0);group.scale.setScalar(host.classList.contains('t-divider')?.65:.9);stars.visible=true;}
      camera.updateProjectionMatrix();start=performance.now();frame(start);if(stage)stage.classList.add('webgl-ready');
    }catch(e){if(stage)stage.classList.remove('webgl-ready');canvas.remove();host=null;}
  }
  document.addEventListener('slidechange',activate);document.addEventListener('visibilitychange',()=>{if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;}else activate();});
  motion.addEventListener('change',activate);canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();if(raf)cancelAnimationFrame(raf);if(stage)stage.classList.remove('webgl-ready');canvas.remove();});activate();
})();
</script>

<script>
// 內容頁右上角：旋轉的小 101（淺色玻璃，取自 ai-b3-1121）
(function(){if(!window.THREE)return;const motion=matchMedia('(prefers-reduced-motion: reduce)');let R;
try{R=new THREE.WebGLRenderer({alpha:true,antialias:true});}catch(e){return;}
const cv=R.domElement;cv.className='mini101';cv.setAttribute('aria-hidden','true');R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(150,230,false);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,150/230,1,2000);cam.position.set(0,190,620);cam.lookAt(0,190,0);
sc.add(new THREE.AmbientLight(0xffffff,.8));const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(-400,600,500);sc.add(sun);
const T=make101(THREE,.55,{glass:0x9FD3CF,glass2:0x7FBFC0,podium:0xC9DCE8,cap:0xB7D8D4,edge:0x1F3A6E,band:0xFFFFFF,tip:0xF2994A});sc.add(T);
const ring=[];for(let i=0;i<=64;i++){const a=i/64*Math.PI*2;ring.push(new THREE.Vector3(Math.cos(a)*80,0,Math.sin(a)*80));}
const rl=new THREE.Line(new THREE.BufferGeometry().setFromPoints(ring),new THREE.LineBasicMaterial({color:0x3dd8ca,transparent:true,opacity:.6}));rl.position.y=120;sc.add(rl);
const dot=new THREE.Mesh(new THREE.SphereGeometry(7,10,8),new THREE.MeshBasicMaterial({color:0xF0A23B}));sc.add(dot);
let host=null,raf=0;
function frame(t){raf=0;if(!host||document.hidden)return;const e=motion.matches?0:t/1000;T.rotation.y=e*.6;dot.position.set(Math.cos(e*1.4)*80,120+Math.sin(e*2)*6,Math.sin(e*1.4)*80);R.render(sc,cam);if(!motion.matches)raf=requestAnimationFrame(frame);}
function act(){if(raf)cancelAnimationFrame(raf);raf=0;host=document.querySelector('.slide.on');
  if(!host||/t-(cover|divider|closing|galaxy)/.test(host.className)){cv.remove();host=null;return;}host.appendChild(cv);frame(performance.now());}
document.addEventListener('slidechange',act);document.addEventListener('visibilitychange',()=>{if(!document.hidden)act();});act();})();
</script>
