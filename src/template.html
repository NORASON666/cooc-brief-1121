<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>把指引帶進臺北教室</title>
<meta name="description" content="2026-11-21 B3 數位教學指引儲備講師培訓工作坊試講：把《115 年中小學教師數位與 AI 教學指引》三個模組接到臺北教室與酷AI，用真實新聞看七大風險。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E3A6E; --ink:#22314d; --blue:#3B82C4; --sky:#5AA9E6; --pale:#DCEEFB; --paper:#FBFDFF;
  --orange:#F0A23B; --soft:#F3F7FB; --line:#C9D9EA; --muted:#5d6b80;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9EFF6;color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#deck{width:1920px;height:1080px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;background:var(--paper);display:none;overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px,#e3ecf6 1px,transparent 0);background-size:28px 28px}
.slide.on{display:block}
.slide:not(.t-cover):not(.t-closing):not(.t-divider)::after{content:"";position:absolute;right:60px;top:36px;width:360px;height:160px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='160'><path d='M10 140 C 90 150 120 60 200 90 S 280 40 300 40' fill='none' stroke='%235AA9E6' stroke-width='3' stroke-dasharray='8 9'/><path d='M300 40 l52 -24 -18 50 -12 -16 z' fill='white' stroke='%231E3A6E' stroke-width='3' stroke-linejoin='round'/></svg>") no-repeat;opacity:.7;pointer-events:none}
.slide::before{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:linear-gradient(90deg,var(--sky),var(--pale) 60%,var(--orange))}
.inner{position:absolute;inset:70px 120px 70px 120px;display:flex;flex-direction:column;z-index:1}
.three .slide:not(.t-cover):not(.t-closing):not(.t-divider)::after{display:none}
@media (prefers-reduced-motion:no-preference){.slide.on .inner{animation:slidein .4s cubic-bezier(.2,.7,.2,1)}}
.slide .kicker{align-self:flex-start;width:fit-content;font-size:24px;color:#fff;background:#18409a;border-radius:999px;padding:5px 22px 6px;margin-bottom:12px;letter-spacing:.08em}
.slide .kicker::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#f2a516;margin-right:12px;vertical-align:2px}
.slide .kicker.big{font-size:32px;padding:8px 30px 9px;margin-bottom:22px}
@keyframes slidein{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.pno{position:absolute;right:40px;bottom:30px;font:700 26px "Noto Sans TC",sans-serif;color:var(--blue)}
.kicker{font:700 30px "Noto Sans TC",sans-serif;color:var(--blue);letter-spacing:.06em;margin-bottom:6px}
.kicker::before{content:"✎ ";color:var(--orange)}
.kicker.big{font-size:44px}
.title{margin:0 0 40px;font-weight:900;font-size:76px;color:var(--navy);line-height:1.15}
.title span{background:linear-gradient(transparent 62%,var(--pale) 62%);padding:0 10px;
  border-bottom:6px solid var(--orange);border-radius:0 0 40px 6px/0 0 10px 4px}
.foot{font-size:38px;font-weight:700;color:var(--navy);margin:28px 0 0;padding:14px 24px;background:#FFF6E6;border-left:10px solid var(--orange);border-radius:6px}
.src{position:absolute;left:0;bottom:-34px;margin:0;font-size:22px;color:var(--muted)}
.link{font-size:32px;color:var(--blue);margin-top:20px;font-weight:700}
mark{background:linear-gradient(transparent 55%,var(--pale) 55%);color:inherit}
/* 封面 */
.cover{position:absolute;inset:-70px -120px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 25%,rgba(255,255,255,.7),transparent 58%)}
.cover .ill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-text{position:relative;text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(245,250,255,.91));padding:44px 76px;border:2px solid rgba(255,255,255,.95);border-radius:36px;box-shadow:0 24px 80px rgba(30,58,110,.14),0 0 70px 30px rgba(251,253,255,.72)}
.cover-text::before{content:"";position:absolute;top:0;left:38%;right:38%;height:6px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,var(--blue),var(--orange))}
.cover .org{font:700 34px "Noto Sans TC",sans-serif;color:var(--blue)}
.cover h1{font-weight:900;font-size:112px;line-height:1.15;color:var(--navy);margin:18px 0}
.cover h1 mark{border-bottom:8px solid var(--orange)}
.cover .meta{font-size:40px;font-weight:700;color:var(--ink)}
.cover .who{margin-top:26px;display:flex;gap:40px;justify-content:center;font-size:36px}
.cover .who b{font:700 46px "Noto Sans TC",sans-serif;color:#B5462E}
.cover .hand{font:700 64px "Noto Sans TC",sans-serif;letter-spacing:.08em;color:var(--blue)}
/* 章節頁 */
.divider{display:flex;align-items:center;height:100%;gap:60px}
.dv-text{flex:1}
.dv-title{font-weight:900;font-size:130px;color:var(--navy);margin:10px 0;line-height:1.1}
.dv-sub{font:700 60px "Noto Sans TC",sans-serif;color:var(--ink);border-bottom:8px solid var(--orange);display:inline-block;padding-bottom:6px}
.dv-ill{width:760px;height:760px;flex:none;display:flex;align-items:center}
.dv-ill .ill{width:100%;height:100%;object-fit:contain;transform:rotate(2deg);filter:drop-shadow(0 24px 28px rgba(30,58,110,.16))}
/* 條列 */
.bul{margin:auto 0;padding-left:1.2em;font-size:50px;line-height:1.55}
.bul li{margin:8px 0}
.bul li::marker{color:var(--orange)}
.bul li.hl{font-weight:700;color:var(--navy)}
ol.bul li::marker{font-weight:900;color:var(--blue)}
.t-bullets .bul{font-size:56px;line-height:1.6}
/* 卡片：手繪框 */
.cards{display:grid;gap:34px;flex:1;min-height:0;grid-auto-rows:1fr;padding:12px 0}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}.c1{grid-template-columns:1fr}
.card{position:relative;display:flex;flex-direction:column;justify-content:center;background:#fff;border:3px solid var(--navy);padding:30px 34px;
  border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:8px 10px 0 var(--pale)}
.card h3{margin:0 0 14px;font-size:44px;font-weight:900;color:var(--navy)}
.card p{margin:0;font-size:36px;line-height:1.5}
.c3 .card h3{font-size:48px}.c3 .card p{font-size:40px}
.c4 .card h3{font-size:44px}.c4 .card p{font-size:36px}
.c5 .card{padding:26px 22px}.c5 .card h3{font-size:40px}.c5 .card p{font-size:32px}
.card .note{margin-top:18px;font:700 30px "Noto Sans TC",sans-serif;color:#B5462E}
.card .num{width:64px;height:64px;border-radius:50%;background:var(--orange);color:#fff;font:900 38px/64px "Noto Sans TC";text-align:center;margin-bottom:14px}
.arrows .card:not(:last-child)::after{content:"➜";position:absolute;right:-36px;top:46%;font-size:40px;color:var(--orange)}
.rd1{background:#F1F8FE}
.stat{border-radius:24px;padding:38px;background:linear-gradient(155deg,#fff,#f2f8fe);box-shadow:0 14px 32px rgba(30,58,110,.1);border:2px solid var(--line)}
.stat .big{font:900 92px "Noto Sans TC";color:var(--blue);line-height:1.1;margin-bottom:10px}
/* 步驟 */
.steps{list-style:none;margin:auto 0;padding:0;display:flex;flex-direction:column;gap:34px}
.steps li{display:flex;align-items:center;gap:30px;font-size:50px;font-weight:700;color:var(--navy);background:#fff;
  border:3px solid var(--navy);padding:22px 34px;border-radius:18px 255px 18px 225px/225px 18px 255px 18px;box-shadow:8px 10px 0 var(--pale)}
.steps .num{flex:none;width:80px;height:80px;border-radius:50%;background:var(--sky);color:#fff;font:900 46px/80px "Noto Sans TC";text-align:center}
.qs li{font-weight:500;font-size:44px;color:var(--ink)}
.qs .num:empty{display:none}
.situation{font-size:52px;font-weight:900;color:var(--navy);margin:16px 0 40px;line-height:1.4}
.situation .tag{display:inline-block;font-size:30px;background:var(--orange);color:#fff;border-radius:12px;padding:4px 18px;margin-right:18px;vertical-align:middle}
/* 表格 */
.tbl{margin:auto 0;border-collapse:separate;border-spacing:0;width:100%;font-size:40px;background:#fff;border:3px solid var(--navy);border-radius:20px;overflow:hidden}
.tbl th{background:var(--navy);color:#fff;padding:22px;font-size:42px}
.tbl td{padding:26px 22px;border-top:2px solid #e5eef7;text-align:center;height:110px}.tbl tbody tr:nth-child(even) td:not(:nth-child(3)){background:#f5f9fd}
.tbl.compact td{height:auto;padding:10px 22px;font-size:36px;line-height:1.35}.tbl.compact th{padding:14px;font-size:44px}
.tbl td:first-child{white-space:nowrap;font-weight:700;color:var(--navy)}
.tbl th:nth-child(3),.tbl td:nth-child(3){background:#FFF8EC}
.tbl th:nth-child(3){background:#B9741C}
/* 圖片 */
.shot{flex:1;display:flex;justify-content:center;align-items:center;min-height:0;gap:40px}
.shot img{height:100%;width:auto;max-width:100%;object-fit:contain;border:3px solid var(--navy);border-radius:14px;box-shadow:12px 14px 0 var(--pale);background:#fff}
.shot.two img{max-width:48%}
.vid{flex:1;display:flex;justify-content:center;align-items:center;min-height:0}.vid video{height:100%;max-width:100%;border:3px solid var(--navy);border-radius:14px;box-shadow:12px 14px 0 var(--pale);background:#000}
.shot.video iframe{height:100%;aspect-ratio:16/9;max-width:100%;border:3px solid var(--navy);border-radius:14px;box-shadow:12px 14px 0 var(--pale);background:#000}
.shot.three{gap:24px}.shot.three img{width:calc((100% - 48px)/3);height:auto;max-height:100%;max-width:none}
.prompt{position:relative;flex:1;min-height:0;margin:0}.prompt.code pre{margin:0;height:100%;max-height:none;overflow:auto;white-space:pre-wrap;background:#fff;border:3px solid var(--navy);border-radius:20px;padding:30px 40px;font:500 33px/1.55 'Noto Sans TC';color:var(--ink);box-shadow:12px 14px 0 var(--pale)}
.prompt.code.small pre{font-size:23px;line-height:1.42;padding:20px 36px}
.prompt.code.mid pre{font-size:27px;line-height:1.42;padding:22px 38px}
.prompt.code.big pre{font-size:44px;line-height:1.6;padding:40px 150px 40px 50px}
.steps.compact{gap:18px}.steps.compact li{font-size:38px;padding-top:14px;padding-bottom:14px}.steps.compact .num{width:64px;height:64px;font-size:36px;line-height:64px}
.prompt.code .copy{font-size:26px;padding:8px 22px;right:20px;top:20px;border-radius:20px}
.dls{display:flex;flex-wrap:wrap;gap:24px;margin-top:20px}
.st{display:flex;gap:42px;flex:1;min-height:0;align-items:center}
.st-img{flex:1.15;display:flex;justify-content:center;min-height:0;height:100%;align-items:center}
.st-img img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 2px #1E3A6E) drop-shadow(12px 14px 0 #DCEEFB)}
.st-text{flex:1}
.st-text p{font-size:42px;line-height:1.6;margin:0 0 28px}
.st-text p b{color:#B5462E}
.st.small .st-img{flex:.55}.st.small .st-text p{font-size:29px;line-height:1.22;margin:0 0 3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ill{mix-blend-mode:multiply}
.illus{flex:1;min-height:0;display:flex;justify-content:center}
.illus .ill{height:100%;max-width:100%;object-fit:contain;border-radius:24px}
.ill.missing{display:flex;align-items:center;justify-content:center;border:4px dashed var(--line);color:var(--muted);font-size:40px;width:70%;border-radius:30px}
.quote{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;margin:0;font:700 72px/1.55 "Noto Sans TC",sans-serif;color:var(--navy)}
.quote.q2{flex:none;font-size:64px;margin:20px 0 40px}
.rel{margin-top:26px;display:flex;align-items:center;gap:22px;font:900 44px 'Noto Sans TC';color:var(--navy)}.rel .tag{flex:none;font:700 28px 'Noto Sans TC';color:#fff;background:var(--sky);border-radius:30px;padding:8px 22px}
.aiday{display:flex;gap:60px;align-items:center;flex:1}
.aiday .bul{flex:1;font-size:44px}
.qr{width:420px;border:3px solid var(--navy);border-radius:14px;background:#fff;padding:10px}
.srcs{display:grid;grid-template-columns:1fr 1fr;gap:40px;font-size:31px;line-height:1.6}
.srcs ul{margin:0;padding-left:1em}
/* 新聞卡 */
.newsgrid{flex:1;display:grid;gap:32px;align-content:center;grid-auto-rows:1fr;min-height:0;padding:12px 0 20px}
.newsgrid.n2{grid-template-columns:1fr 1fr}.newsgrid.n1{grid-template-columns:1fr}.newsgrid.n3{grid-template-columns:repeat(3,1fr)}
.news{position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:linear-gradient(150deg,#fff,#f6faff);border:2px solid var(--line);border-top:7px solid var(--blue);border-radius:22px;box-shadow:0 16px 36px rgba(30,58,110,.1);overflow:hidden}
.news::before{content:"NEWS";position:absolute;right:-10px;top:-18px;font:900 120px "Noto Sans TC";color:#F1F6FC;z-index:0}
.news>*{position:relative}
.nw-text{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 40px 70px;min-width:0}
.nw-k{display:flex;gap:16px;align-items:center;font-size:28px;color:var(--muted)}
.nw-k b{background:var(--navy);color:#fff;border-radius:999px;padding:6px 18px;font-size:25px}.nw-k span{font-weight:700;letter-spacing:.03em}
.news h3{margin:28px 0 20px;font:900 50px/1.3 "Noto Sans TC";color:var(--navy)}
.news p{margin:0;font-size:34px;line-height:1.55;color:#4b5d77}
.nw-go{position:absolute;right:30px;bottom:20px;font:700 24px "Noto Sans TC";color:var(--blue)}
.ni{flex:1;display:flex;gap:70px;align-items:center;min-height:0}
.ni-img{height:100%;display:flex;align-items:center}
.ni-img img{height:100%;max-height:640px;border:3px solid var(--navy);border-radius:16px;box-shadow:12px 14px 0 var(--pale);background:#fff}
.ni-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:26px;flex:1}
.ni-steps li{display:flex;gap:26px;align-items:center;background:#fff;border:3px solid var(--navy);border-radius:18px;padding:18px 28px;font-size:40px}
.ni-steps b{flex:none;font:900 44px "Noto Sans TC";color:#fff;background:var(--orange);border-radius:12px;padding:4px 16px}
.nw-shot{display:block;width:100%;height:42%;min-height:0;object-fit:cover;object-position:top;border-bottom:3px solid var(--navy)}
.newsgrid.n1 .news.has-shot{flex-direction:row;align-items:stretch}
.newsgrid.n1 .nw-shot{width:48%;height:auto;align-self:stretch;object-fit:cover;border-bottom:0;border-right:3px solid var(--navy)}
.slide .inner .news img{cursor:pointer}
/* 臺北／酷AI 底部標籤 */
#tpbar{position:absolute;left:40px;bottom:22px;display:flex;align-items:center;gap:12px;font:700 22px "Noto Sans TC";color:var(--navy);pointer-events:none}
#tpbar i{font-style:normal;background:var(--orange);color:#fff;border-radius:999px;padding:2px 14px;font-size:20px}
@media print{#tpbar{display:none}}
/* 導覽頁 */
.navgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:44px;align-content:center}
.navcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:14px;background:#fff;border:3px solid var(--navy);border-radius:28px;padding:40px 40px 80px;box-shadow:12px 14px 0 var(--pale);cursor:pointer;font-family:"Noto Sans TC";color:var(--ink);transition:transform .15s,box-shadow .15s}
.navcard:hover{transform:translateY(-6px);box-shadow:12px 20px 0 #FFE2B8}
.navcard::before{content:"";position:absolute;inset:0 auto 0 0;width:14px;background:var(--nav-color);border-radius:24px 0 0 24px}
.navcard::after{position:absolute;right:34px;top:18px;font:900 100px/1 "Noto Sans TC";color:var(--nav-color);opacity:.18}
.navcard:nth-child(1){--nav-color:#3B82C4}.navcard:nth-child(1)::after{content:"01"}
.navcard:nth-child(2){--nav-color:#E59A32}.navcard:nth-child(2)::after{content:"02"}
.navcard:nth-child(3){--nav-color:#328D83}.navcard:nth-child(3)::after{content:"03"}
.navcard .nv-k{background:var(--nav-color)}
.nv-k{font:900 30px "Noto Sans TC";color:#fff;background:var(--orange);border-radius:999px;padding:4px 22px}
.nv-t{font:900 64px/1.15 "Noto Sans TC";color:var(--navy)}
.nv-m{font:700 34px "Noto Sans TC";color:var(--blue)}
.nv-d{font-size:32px;line-height:1.5}
.nv-go{position:absolute;right:34px;bottom:26px;font:900 30px "Noto Sans TC";color:var(--orange)}
#secchip{position:fixed;left:14px;top:12px;z-index:11;display:flex;gap:6px;padding:5px;background:rgba(255,255,255,.92);border:2px solid var(--navy);border-radius:22px;box-shadow:0 4px 14px rgba(30,58,110,.2)}
#secchip button{font:700 15px "Noto Sans TC";border:none;background:#fff;color:var(--navy);border-radius:14px;padding:6px 12px;cursor:pointer}
#secchip button.act{background:var(--orange);color:#fff}
#secchip .g3btn{border-left:2px solid var(--line);border-radius:0 14px 14px 0}
@media print{#secchip{display:none}}
/* 酷AI 元素（取自 ailms.tp.edu.tw 首頁）：logo 膠囊、吉祥物插圖 */
#tpbar{background:linear-gradient(90deg,#2BB5A8,#5CCFC2);border-radius:999px;padding:5px 16px 5px 12px;color:#fff}
#tpbar img{height:22px;display:block}
#tpbar i{background:#fff;color:#1E8F85}
.kscene{position:absolute;right:44px;top:22px;height:150px;pointer-events:none;z-index:1;filter:drop-shadow(0 6px 10px rgba(30,58,110,.12))}
.slide.t-cover .kscene,.slide.t-closing .kscene{top:auto;bottom:40px;right:60px;height:430px}
.slide.t-divider .kscene{top:auto;bottom:28px;right:auto;left:560px;height:190px}
.klogo{position:absolute;left:60px;top:48px;height:44px;padding:10px 18px;border-radius:14px;background:linear-gradient(90deg,#2BB5A8,#5CCFC2);z-index:2}
/* 工具列：貼齊最上緣、平常半透明，滑鼠移上去才清楚；滑鼠 2 秒不動就收起 */
#bar,#secchip{top:2px!important;opacity:.18;transition:opacity .25s,transform .25s;transform-origin:top center}
#bar{transform:translateX(-50%) scale(.82)}#secchip{transform:scale(.82);transform-origin:top left}
#bar:hover,#secchip:hover,body.uiwake #bar,body.uiwake #secchip{opacity:.95}
body.uiidle #bar,body.uiidle #secchip{opacity:0;pointer-events:none}
/* ── 三個模組三種視覺（共用酷AI／酷課雲元素：logo 膠囊、吉祥物、酷課雲標籤） */
/* 模組一：航海（指引是一艘船）— 酷AI 青綠＋海浪 */
.slide[data-sec=m1]{--navy:#0E4F5C;--ink:#16343b;--blue:#1E8F85;--sky:#5CCFC2;--pale:#D3F1EC;--orange:#F0A23B;--line:#B9E2DC;
  background-color:#F5FCFB;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60'><path d='M0 40 Q30 25 60 40 T120 40 T180 40 T240 40' fill='none' stroke='%23CDEFEA' stroke-width='3'/></svg>");background-size:240px 60px}
.slide[data-sec=m1]::before{background:linear-gradient(90deg,#2BB5A8,#5CCFC2 55%,#F0A23B)}
.slide[data-sec=m1] .slide .kicker,.slide[data-sec=m1] .kicker{background:#1E8F85}
.slide[data-sec=m1] .tbl th:nth-child(3){background:#1E8F85}.slide[data-sec=m1] .tbl td:nth-child(3){background:#EFFAF8}
/* 模組二：新聞編輯台（七大風險配新聞）— 報紙紙張＋朱紅 */
.slide[data-sec=m2]{--navy:#2B2D42;--ink:#2B2D42;--blue:#C2410C;--sky:#F08A5D;--pale:#FDE3D8;--orange:#E85D3F;--line:#EBCFC3;
  background-color:#FFFBF5;background-image:repeating-linear-gradient(0deg,transparent 0 33px,#F3E6D8 33px 34px)}
.slide[data-sec=m2]::before{background:linear-gradient(90deg,#2B2D42 0 30%,#E85D3F 30% 70%,#2B2D42 70%)}

<script>

function paint(){const r=remain(),sec=Math.ceil(r);tLeft.textContent=fmt(r);tBar.style.width=(tTotal?Math.max(0,r/tTotal*100):0)+'%';
  badge.classList.toggle('warn',sec<=60&&sec>10);badge.classList.toggle('danger',sec<=10&&sec>0);glow.classList.toggle('on',sec<=10&&sec>0&&tRemainPaused===null);
  badge.classList.toggle('paused',tRemainPaused!==null);
  if(tRemainPaused===null&&sec!==lastSec){if(lastSec>0){ if(sec===10)warnMelody(); if(sec>0)tick(sec);} lastSec=sec;}
  if(tRemainPaused===null&&r<=0){stopTimer(false);up.classList.add('open');finale();}}
function startTimer(total){ac();tTotal=total;tEnd=Date.now()+total*1000;tRemainPaused=null;lastSec=Math.ceil(total);badge.classList.add('show');clearInterval(tTimer);tTimer=setInterval(paint,100);paint();tp.classList.remove('open');}
function stopTimer(hide=true){clearInterval(tTimer);tTimer=null;glow.classList.remove('on');badge.classList.remove('warn','danger');if(hide){badge.classList.remove('show');tRemainPaused=null;}else{tLeft.textContent='00:00';tBar.style.width='0%';}}
tStart.onclick=()=>{const t=(+tMin.value||0)*60+(+tSec.value||0);if(t>0)startTimer(t);};
tp.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const t=+b.dataset.p;tMin.value=Math.floor(t/60);tSec.value=t%60;startTimer(t);});
tPause.onclick=()=>{if(!tTimer&&tRemainPaused===null)return;if(tRemainPaused===null){tRemainPaused=remain();}else{tEnd=Date.now()+tRemainPaused*1000;tRemainPaused=null;lastSec=Math.ceil(remain());}paint();};
tAdd.onclick=()=>{if(tRemainPaused!==null){tRemainPaused+=60;}else if(tTimer){tEnd+=60000;}else return;tTotal+=60;lastSec=Math.ceil(remain());paint();};
tReset.onclick=()=>{stopTimer(true);tp.classList.remove('open');};
badge.onclick=()=>tp.classList.toggle('open');
up.onclick=()=>{up.classList.remove('open');badge.classList.remove('show');};

  if(k==='h'||k==='H')goSec('nav');else if(k==='1')goSec('m1');else if(k==='2')goSec('m2');else if(k==='3')goSec('m3');});
const _show=show;show=function(i){const d=document.getElementById('deck');d.classList.remove('flash');void d.offsetWidth;d.classList.add('flash');_show(i);const s=slides[cur].dataset.sec;document.querySelectorAll('#secchip button').forEach(b=>b.classList.toggle('act',b.dataset.go===s));};

{const g=new URLSearchParams(location.search).get('go');if(g)setTimeout(()=>goSec(g),0);}

<script src="assets/vendor/three.min.js"></script>
<script>
// three.js 視覺層（載入失敗就不顯示，不影響簡報）
// 封面／章節／結尾：臺北天際線＋101＋往上飄的酷AI 對話泡泡；內容頁：右上角旋轉的小 101
(function(){if(!window.THREE)return;
const cv=document.createElement('canvas');
cv.style.cssText='position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;mix-blend-mode:multiply;z-index:0';
let R;try{R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});}catch(e){return;}
document.documentElement.classList.add('three');
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(1920,1080,false);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(42,1920/1080,1,3000);cam.position.z=900;
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
x.beginPath();x.arc(32,32,26,0,7);x.fillStyle='#fff';x.fill();const tex=new THREE.CanvasTexture(c);
const V=(a,b,c)=>new THREE.Vector3(a,b,c);
// 每個群組記下自己的材質，方便整組淡入淡出
function layer(){const g=new THREE.Group();g.mats=[];scene.add(g);
  g.mat=(m,o)=>{m.transparent=true;m.base=o;m.opacity=0;g.mats.push(m);return m;};
  g.lines=(arr,color,o)=>{const b=new THREE.BufferGeometry().setFromPoints(arr);const l=new THREE.LineSegments(b,g.mat(new THREE.LineBasicMaterial({color}),o));g.add(l);return l;};
  g.dots=(arr,color,size,o)=>{const b=new THREE.BufferGeometry().setFromPoints(arr);const m=new THREE.Points(b,g.mat(new THREE.PointsMaterial({color,size,map:tex,alphaTest:.05}),o));g.add(m);return m;};
  g.a=0;g.fade=(to,k)=>{g.a+=(to-g.a)*k;g.visible=g.a>.01;g.mats.forEach(m=>m.opacity=m.base*g.a);};return g;}
// 沿線跑的訊號
function pulses(g,edges,n,color,size){const S=Array.from({length:n},()=>({e:edges[Math.floor(rnd()*edges.length)],t:rnd(),v:.25+rnd()*.5}));
  const pts=S.map(()=>V(0,0,0)),m=g.dots(pts,color,size,1);
  return (dt,k)=>{S.forEach((s,i)=>{s.t+=s.v*dt*k;if(s.t>1){s.t=0;s.e=edges[Math.floor(Math.random()*edges.length)];}pts[i].lerpVectors(s.e[0],s.e[1],s.t);});m.geometry.setFromPoints(pts);};}

// ── 1. 節點網路（中央留空給標題）
const net=layer(),P=[];
while(P.length<130){const a=(rnd()-.5)*1900,b=(rnd()-.5)*1000,d=(rnd()-.5)*500;if(Math.abs(a)<520&&Math.abs(b)<230)continue;P.push(V(a,b,d));}
const E=[];P.forEach((a,i)=>{P.map((b,j)=>[a.distanceTo(b),j]).sort((u,v)=>u[0]-v[0]).slice(1,4).forEach(([d,j])=>{if(d<330&&i<j)E.push([P[i],P[j]]);});});
net.lines(E.flat(),0x6FA8DC,.6);net.dots(P,0x3D7DC8,16,.75);
const netPulse=pulses(net,E,22,0xF2994A,20);

// ── 2. 臺北 101（低多邊形線框）：封面／章節是天際線大圖，內容頁是右上角小模型
function make101(g,s,edgeCol){
  // 臺北 101：玻璃藍綠、有光影；兩個面受光不同，看得出立體
  const M=(c)=>g.mat(new THREE.MeshLambertMaterial({color:c,flatShading:true}),1);
  const glass=M(0x9FD3CF),glass2=M(0x7FBFC0),podium=M(0xC9DCE8),cap=M(0xB7D8D4),
        edge=g.mat(new THREE.LineBasicMaterial({color:edgeCol}),.55),band=g.mat(new THREE.LineBasicMaterial({color:0xFFFFFF}),.7);
  const tw=new THREE.Group();g.add(tw);let y=0;
  const put=(rt,rb,h,m,bands)=>{const geo=new THREE.CylinderGeometry(rt*s,rb*s,h*s,4,1);const me=new THREE.Mesh(geo,m);me.position.y=y+h*s/2;me.rotation.y=Math.PI/4;tw.add(me);
    const l=new THREE.LineSegments(new THREE.EdgesGeometry(geo),edge);l.position.copy(me.position);l.rotation.copy(me.rotation);tw.add(l);
    for(let k=1;k<=(bands||0);k++){const f=k/(bands+1),r=(rb+(rt-rb)*f)*s+.3,yy=y+h*s*f,P=[];             // 樓層窗帶
      for(let q=0;q<4;q++){const a=q*Math.PI/2,b=a+Math.PI/2;P.push(new THREE.Vector3(Math.cos(a)*r,yy,Math.sin(a)*r),new THREE.Vector3(Math.cos(b)*r,yy,Math.sin(b)*r));}
      tw.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(P),band));}
    y+=h*s;};
  put(58,62,26,podium,1);                       // 裙樓
  put(27,37,118,glass2,5);                      // 基座：往上收
  put(31,31,4,cap);
  for(let i=0;i<8;i++){put(31,24,44,i%2?glass:glass2,3);put(32,32,3,cap);}   // 八節「花開富貴」：每節往上外擴
  put(17,23,22,cap,1); put(9,12,22,glass,1);    // 塔頂
  put(.6,2.6,96,cap);                           // 塔尖
  const tip=new THREE.Sprite(g.mat(new THREE.SpriteMaterial({map:tex,color:0xF2994A}),.9));tip.scale.set(18*s,18*s,1);tip.position.y=y;tw.add(tip);
  tw.top=y;return tw;}
// 光源（只影響有光照材質的 101）
scene.add(new THREE.AmbientLight(0xffffff,.78));const sun=new THREE.DirectionalLight(0xffffff,.65);sun.position.set(-400,600,500);scene.add(sun);
// 酷AI 對話泡泡貼圖
function bubbleTex(txt,bg){const c=document.createElement('canvas');c.width=256;c.height=160;const x=c.getContext('2d');
  x.fillStyle=bg;x.beginPath();x.roundRect(8,8,240,110,50);x.fill();x.beginPath();x.moveTo(70,112);x.lineTo(54,150);x.lineTo(110,114);x.fill();
  x.fillStyle='#fff';x.font='900 52px "Noto Sans TC",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,128,64);return new THREE.CanvasTexture(c);}
const BUB=[['酷AI',0xF0A23B,'#F0A23B'],['AI',0x3B82C4,'#3B82C4'],['?',0x5AA9E6,'#5AA9E6'],['ABC',0xF0A23B,'#F0A23B'],['臺北',0x1E3A6E,'#1E3A6E']].map(b=>bubbleTex(b[0],b[2]));

// 2a. 天際線（封面／章節／結尾）
const city=layer();city.position.set(0,-345,0);
const T101=make101(city,.72,0x1F3A6E);T101.position.set(-470,0,40);T101.rotation.y=.42;
const bx=[],bedge=city.mat(new THREE.LineBasicMaterial({color:0x6FA8DC}),.75),bface=city.mat(new THREE.MeshBasicMaterial({color:0xE7F1FB}),1),farEdge=city.mat(new THREE.LineBasicMaterial({color:0xB9D3EA}),.5),farFace=city.mat(new THREE.MeshBasicMaterial({color:0xF5F9FD}),1);
for(let i=0;i<34;i++){const w=30+rnd()*60,h=40+rnd()*170,d=30+rnd()*50,x=-760+i*46+rnd()*20;if(Math.abs(x+470)<70)continue;
  const far=i%2===0,geo=new THREE.BoxGeometry(w,h,d),m=new THREE.Mesh(geo,far?farFace:bface);m.position.set(x,h/2,far?-390:-120);city.add(m);
  const l=new THREE.LineSegments(new THREE.EdgesGeometry(geo),far?farEdge:bedge);l.position.copy(m.position);city.add(l);bx.push(m.position.clone().add(V(0,h/2,0)));}
const bubs=Array.from({length:9},(_,i)=>{const sp=new THREE.Sprite(city.mat(new THREE.SpriteMaterial({map:BUB[i%BUB.length]}),.95));
  sp.scale.set(70,44,1);sp.u={o:bx[Math.floor(rnd()*bx.length)]||V(0,0,0),t:rnd(),v:.05+rnd()*.06};city.add(sp);return sp;});
const tip=V(-470,T101.top,40),SK=bx.map(p=>[tip,p]).filter((_,i)=>i%3===0);
city.lines(SK.flat(),0xF2C48A,.35);const skyPulse=pulses(city,SK,10,0xF2994A,16);

// 2b. 右上角小 101（內容頁）＋繞行的酷AI 泡泡
const hub=layer();hub.position.set(665,235,0);
const M101=make101(hub,.20,0x1F3A6E);M101.position.y=0;
const ring=[];for(let i=0;i<=64;i++){const a=i/64*Math.PI*2;ring.push(V(Math.cos(a)*70,0,Math.sin(a)*70));}
const rg=[];for(let i=0;i<64;i++)rg.push(ring[i],ring[i+1]);const rl=hub.lines(rg,0xF0A23B,.5);rl.position.y=95;
const hb=new THREE.Sprite(hub.mat(new THREE.SpriteMaterial({map:BUB[0]}),1));hb.scale.set(38,24,1);hub.add(hb);
const hubPulse=()=>{};
const motion=matchMedia('(prefers-reduced-motion: reduce)');let still=motion.matches;motion.addEventListener('change',e=>{still=e.matches;});
let host=null,last=0,full=true,boost=0,pose=0,idx=0;
function frame(t){requestAnimationFrame(frame);
  const on=document.querySelector('.slide.on');
  if(on!==host){host=on;if(!on)return;if(on.classList.contains("t-cover"))on.appendChild(cv);else on.insertBefore(cv,on.firstChild);full=/t-(cover|divider|closing)/.test(on.className);
    idx=[...on.parentNode.children].indexOf(on);pose=((idx%5)-2)*.13;boost=1;}
  if(!host)return;const dt=Math.min((t-last)/1000,.05);last=t;const k=still?1:Math.min(1,dt*5);
  net.fade(full?.55:0,k);city.fade(full?1:0,k);hub.fade(0,k);boost*=1-Math.min(1,dt*1.6);
  if(!still){net.rotation.y+=(pose+Math.sin(t/9000)*.2-net.rotation.y)*Math.min(1,dt*2.5);net.rotation.x=Math.cos(t/11000)*.1;
    M101.rotation.y=t/4000;const a=t/1500;hb.position.set(Math.cos(a)*70,95+Math.sin(t/700)*6,Math.sin(a)*70);
    city.rotation.y=Math.sin(t/12000)*.06;bubs.forEach(b=>{b.u.t+=b.u.v*dt;if(b.u.t>1){b.u.t=0;b.u.o=bx[Math.floor(Math.random()*bx.length)];}b.position.set(b.u.o.x+Math.sin(t/1800+b.u.t*6)*12,b.u.o.y+30+b.u.t*260,b.u.o.z);const scale=1+.07*Math.sin(t/1200+b.u.t*6);b.scale.set(70*scale,44*scale,1);b.material.opacity=.95*Math.sin(b.u.t*Math.PI)*city.a;});}
  if(still){M101.rotation.y=0;hb.position.set(55,80,0);city.rotation.y=0;net.rotation.set(0,0,0);bubs.forEach(b=>{b.position.set(b.u.o.x,b.u.o.y+30+b.u.t*260,b.u.o.z);b.scale.set(70,44,1);b.material.opacity=.8*city.a;});}
  const sp=still?0:1+boost*3;if(net.visible)netPulse(dt,sp);if(city.visible)skyPulse(dt,sp);
  R.render(scene,cam);}
requestAnimationFrame(frame);})();
</script>
